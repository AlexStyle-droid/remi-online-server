<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Remi Online — Remi Etalat cu jucători reali</title>
<style>
  :root{
    --felt-1:#0d3b2e; --felt-2:#08261e; --felt-3:#051a15;
    --gold:#e8c66a; --gold-2:#c9a227;
    --bg:#07120f; --panel:#0f211c; --panel-2:#132b24;
    --line:rgba(232,198,106,.18);
    --text:#eef5f1; --muted:#9fb3ab;
    --red:#e5484d; --yellow:#f5c542; --blue:#3b82f6; --black:#34343f;
    --danger:#ef4444; --ok:#34d399;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #123d31 0%, #0a2a22 45%, #061713 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  .hidden{display:none !important;}
  .spacer{flex:1;}

  /* ---------- generic buttons ---------- */
  .btn{
    border-radius:14px; padding:13px 18px; font-size:16px; font-weight:700;
    background:linear-gradient(180deg,#1a3b31,#122a23);
    color:var(--text); border:1px solid rgba(255,255,255,.08);
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .06s ease, filter .15s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:translateY(1px) scale(.995);}
  .btn.primary{
    background:linear-gradient(180deg,#f0d17f,#c9a227);
    color:#221a04; border:1px solid #f7e7ae;
    box-shadow:0 8px 24px rgba(201,162,39,.35), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .btn.gold-outline{background:rgba(232,198,106,.08);border:1px solid rgba(232,198,106,.45);color:var(--gold);}
  .btn.danger{background:linear-gradient(180deg,#7f1d1d,#5a1414);border:1px solid #ef444466;}
  .btn:disabled{opacity:.35;filter:saturate(.4);pointer-events:none;}
  .btn.small{padding:9px 12px;font-size:13px;border-radius:11px;}
  .btn.block{width:100%;}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.12);}
  .icon{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.15em;}

  /* ---------- HOME ---------- */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .home-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:22px;}
  .home{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;padding-bottom:30px;}
  .brand{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1;
    background:linear-gradient(180deg,#fff6d8,#e8c66a 55%,#a8851d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 20px rgba(232,198,106,.25));}
  .brand small{display:block;font-size:13px;letter-spacing:5px;color:var(--muted);
    -webkit-text-fill-color:var(--muted);font-weight:700;margin-top:8px;}
  .tag{color:var(--muted);font-size:14px;margin:4px 0 10px;}
  .field{display:flex;flex-direction:column;gap:6px;text-align:left;}
  .field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
  .inp{
    width:100%;padding:14px 16px;border-radius:14px;font-size:17px;font-weight:600;
    background:rgba(0,0,0,.28);color:var(--text);
    border:1px solid rgba(232,198,106,.22);outline:none;
  }
  .inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,198,106,.12);}
  .inp.center{text-align:center;letter-spacing:6px;text-transform:uppercase;font-size:22px;}
  .foot{color:#5f7a70;font-size:12px;margin-top:14px;}
  .linkbtn{background:none;border:none;color:var(--gold);font-size:14px;padding:10px;text-decoration:underline;text-underline-offset:3px;}

  /* ---------- LOBBY ---------- */
  .lobby{flex:1;overflow:auto;padding:18px 16px 30px;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .lobby-inner{width:min(520px,100%);display:flex;flex-direction:column;gap:14px;}
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);}
  .codebox{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0 2px;}
  .codebox .code{font-size:40px;font-weight:900;letter-spacing:10px;color:#fff;
    text-shadow:0 0 30px rgba(232,198,106,.45);}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;}
  .rowline + .rowline{border-top:1px dashed rgba(255,255,255,.07);}
  .rowline .k{color:var(--muted);font-size:13px;font-weight:600;}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .pitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);}
  .pitem .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;color:#0c1a16;background:linear-gradient(180deg,#f0d17f,#c9a227);flex:none;}
  .pitem .nm{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pitem .badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--muted);}
  .pitem .badge.ready{background:rgba(52,211,153,.15);color:#6ee7b7;}
  .pitem .badge.host{background:rgba(232,198,106,.15);color:var(--gold);}
  select.inp{padding:11px 12px;font-size:15px;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;}
  .settings-row label{font-size:14px;color:var(--muted);font-weight:600;}
  .settings-row select{width:130px;}

  /* ---------- GAME ---------- */
  .game{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
  .topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.12));}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);padding:6px 10px;border-radius:20px;}
  .chip b{color:var(--gold);}
  .topbar .btn.icon-btn{width:36px;height:36px;padding:0;border-radius:11px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);font-size:17px;}

  .opps{display:flex;gap:5px;padding:4px 6px 3px;overflow-x:auto;}
  .opp{flex:1;min-width:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:4px 6px;position:relative;transition:box-shadow .25s,border-color .25s;}
  .opp.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(232,198,106,.28);}
  .opp .l1{display:flex;align-items:center;gap:5px;}
  .opp .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#0c1a16;flex:none;background:linear-gradient(180deg,#f0d17f,#c9a227);}
  .opp .nm{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .opp .l2{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .opp .l2 .cnt{display:inline-flex;align-items:center;gap:3px;}
  .minicard{display:inline-block;width:7px;height:10px;border-radius:1.5px;background:rgba(232,198,106,.8);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}
  .opp .l2 .sc{color:var(--gold);}
  .opp .meld{font-size:8.5px;font-weight:900;padding:1px 5px;border-radius:20px;
    background:#0e2c23;border:1px solid rgba(52,211,153,.5);color:#6ee7b7;}
  .opp .meld.no{border-color:rgba(255,255,255,.15);color:var(--muted);}
  .opp .atu{font-size:8.5px;font-weight:900;padding:1px 5px;border-radius:20px;
    background:#2b2408;border:1px solid rgba(232,198,106,.6);color:var(--gold);}
  .opp .timer{position:absolute;left:0;bottom:0;height:2.5px;background:var(--gold);border-radius:0 3px 3px 0;transition:width .9s linear;}

  .tablewrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(90% 60% at 50% 45%, rgba(33,99,79,.55) 0%, rgba(6,25,20,0) 70%),
      linear-gradient(180deg,#0a2f25 0%, #08251d 55%, #061a15 100%);
    border-top:1px solid rgba(255,255,255,.05);}
  .tablewrap:before{content:"";position:absolute;inset:8px;border:1px solid rgba(232,198,106,.13);border-radius:22px;pointer-events:none;}
  .tablewrap:after{content:"REMI";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    font-size:54px;font-weight:900;letter-spacing:10px;color:rgba(232,198,106,.045);
    pointer-events:none;user-select:none;}
  .playzone{padding:2px 8px 4px;display:flex;flex-direction:column;gap:3px;position:relative;}
  .playzone .pzlabel{font-size:8.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    color:rgba(232,198,106,.45);text-align:center;line-height:1;}
  .piles{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 8px;}
  .pile{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .pile .lbl{font-size:10px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.45);text-transform:uppercase;}
  .deck{position:relative;width:48px;height:65px;border-radius:9px;cursor:pointer;transition:transform .1s;}
  .deck:active{transform:scale(.97);}
  .deck .back{position:absolute;inset:0;border-radius:9px;border:1px solid rgba(232,198,106,.5);
    background:
      repeating-linear-gradient(45deg, rgba(232,198,106,.16) 0 4px, transparent 4px 8px),
      linear-gradient(160deg,#1d4a3b,#0c2a21);
    box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(0,0,0,.18);}
  .deck .back:after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(232,198,106,.75);font-size:20px;}
  .deck .count{position:absolute;right:-6px;bottom:-6px;background:#0b1f19;border:1px solid rgba(232,198,106,.5);
    color:var(--gold);font-size:10.5px;font-weight:900;padding:2px 6px;border-radius:20px;}
  .deck.glow{box-shadow:0 0 0 2px var(--gold), 0 0 22px rgba(232,198,106,.35);border-radius:9px;}
  .pile.discard .deck{width:48px;height:65px;}
  .pile .atu-tile{transform:scale(.82);transform-origin:top center;}

  .groups{flex:1;min-height:0;overflow:auto;padding:3px 8px 6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center;}
  .group{position:relative;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.07);border-radius:12px;
    padding:9px 7px 6px;display:flex;flex-direction:column;gap:4px;transition:box-shadow .2s,border-color .2s;}
  .group.mine{border-color:rgba(232,198,106,.35);}
  .group.target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,198,106,.5),0 0 20px rgba(232,198,106,.25);cursor:pointer;}
  .group .gtiles{display:flex;gap:2px;}
  .group .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.5);}
  .group .meta .who{display:flex;align-items:center;gap:4px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .group .meta .pts{color:var(--gold);}
  .empty-table{width:100%;text-align:center;color:rgba(255,255,255,.25);font-size:13px;font-weight:700;padding:26px 10px;}

  /* ---------- TILES ---------- */
  .tile{position:relative;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-weight:900;letter-spacing:-.5px;box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    border:1px solid rgba(0,0,0,.35);flex:none;overflow:hidden;}
  .tile:after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 42%);pointer-events:none;}
  .tile.cR{background:linear-gradient(165deg,#f26468,#c82b33);color:#fff;}
  .tile.cY{background:linear-gradient(165deg,#ffd964,#e0a70f);color:#3b2a00;}
  .tile.cB{background:linear-gradient(165deg,#6aa8ff,#2563eb);color:#fff;}
  .tile.cK{background:linear-gradient(165deg,#5a5a6e,#23232c);color:#fff;}
  .tile.cJ{background:linear-gradient(165deg,#3c2f6b,#1b1436);color:#ffe9a3;border-color:#8c7a3a;}
  .tile .num{position:relative;z-index:1;line-height:1;}
  .tile .jk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1;}
  .tile .jk b{font-size:.62em;opacity:.95;margin-top:1px;}
  .tile.sm{width:26px;height:36px;font-size:15px;border-radius:5px;}
  .tile.md{width:33px;height:45px;font-size:18px;}
  .tile.lg{width:44px;height:60px;font-size:24px;}
  .tile.xl{width:42px;height:58px;font-size:23px;}
  .tile.sel{box-shadow:0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,.5);transform:translateY(-8px);}
  .tile.back{background:repeating-linear-gradient(45deg,#164336 0 4px,#0d2c23 4px 8px);
    border:1px solid rgba(232,198,106,.45);color:rgba(232,198,106,.8);}
  .tile.back .num{font-size:.7em;}

  /* ---------- MY AREA ---------- */
  .mybar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid rgba(255,255,255,.06);
    background:rgba(0,0,0,.25);font-size:12px;font-weight:800;color:var(--muted);}
  .mybar .me-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:#0c1a16;background:linear-gradient(180deg,#f0d17f,#c9a227);}
  .mybar .nm{color:var(--text);font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mybar .pill{font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(255,255,255,.07);}
  .mybar .pill.ok{background:rgba(52,211,153,.14);color:#6ee7b7;}
  .mybar .pill.warn{background:rgba(232,198,106,.13);color:var(--gold);}
  .mybar .turnmsg{margin-left:auto;color:var(--gold);font-size:11.5px;}

  .hand-wrap{padding:2px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42));}
  .hands{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:12px 4px 4px;scrollbar-width:none;}
  .hands::-webkit-scrollbar{display:none;}
  .hands .tile{cursor:pointer;transition:transform .12s ease, box-shadow .12s;}
  .hands .tile.sel{transform:translateY(-12px);}
  .handhint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);
    height:18px;overflow:hidden;white-space:nowrap;padding-bottom:1px;}
  .handhint .pts{color:var(--gold);}

  .actionbar{display:flex;gap:6px;padding:4px 8px calc(6px + env(safe-area-inset-bottom));justify-content:center;flex-wrap:nowrap;}
  .actionbar .btn{flex:1;min-width:0;padding:11px 8px;font-size:14px;border-radius:12px;white-space:nowrap;overflow:hidden;}

  /* ---------- MODALS ---------- */
  .overlay{position:fixed;inset:0;background:rgba(2,8,6,.72);backdrop-filter:blur(6px);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{width:min(520px,100%);max-height:86dvh;overflow:auto;border-radius:20px;
    background:linear-gradient(180deg,#12281f,#0b1a15);border:1px solid rgba(232,198,106,.28);
    box-shadow:0 24px 70px rgba(0,0,0,.6);padding:20px;}
  .modal h2{margin:0 0 6px;font-size:20px;}
  .modal h3{margin:16px 0 6px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;}
  .modal p,.modal li{font-size:14px;line-height:1.55;color:#d5e3dd;}
  .modal ul{padding-left:20px;margin:6px 0;}
  .modal .mfoot{display:flex;gap:8px;margin-top:18px;}
  .modal .mfoot .btn{flex:1;}
  .close-x{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted);}
  .modal-wrap{position:relative;}

  .result-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
  .result-table th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:right;padding:6px 4px;}
  .result-table th:first-child{text-align:left;}
  .result-table td{padding:8px 4px;text-align:right;border-top:1px solid rgba(255,255,255,.07);font-weight:700;}
  .result-table td:first-child{text-align:left;}
  .result-table .pos{color:var(--ok);} .result-table .neg{color:var(--danger);}
  .result-table tr.winner td{color:var(--gold);}
  .bigwin{font-size:34px;text-align:center;margin:6px 0 0;}

  /* chat */
  .chatbox{display:flex;flex-direction:column;height:min(60dvh,420px);}
  .chatmsgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:8px 2px;}
  .msg{max-width:85%;padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;line-height:1.35;}
  .msg b{color:var(--gold);font-size:11.5px;display:block;margin-bottom:2px;}
  .msg.me{align-self:flex-end;background:rgba(232,198,106,.13);}
  .chatform{display:flex;gap:7px;margin-top:8px;}
  .chatform input{flex:1;padding:11px 13px;border-radius:12px;border:1px solid rgba(232,198,106,.22);
    background:rgba(0,0,0,.3);color:#fff;font-size:14px;outline:none;}
  .quick{display:flex;gap:6px;overflow-x:auto;padding:6px 0 0;}
  .quick button{flex:none;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:20px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--muted);}

  .toast-wrap{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;
    flex-direction:column;gap:6px;align-items:center;z-index:80;pointer-events:none;padding:0 12px;}
  .toast{background:rgba(9,26,21,.95);border:1px solid rgba(232,198,106,.35);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);
    animation:tin .22s ease;max-width:92%;text-align:center;}
  .toast.err{border-color:rgba(239,68,68,.6);}
  @keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .logline{position:absolute;left:10px;bottom:6px;right:10px;font-size:10.5px;color:rgba(255,255,255,.42);text-align:center;
    pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .turnbanner{position:relative;align-self:center;font-size:10.5px;font-weight:900;
    letter-spacing:1.2px;text-transform:uppercase;padding:4px 12px;border-radius:20px;z-index:5;
    background:rgba(232,198,106,.14);border:1px solid rgba(232,198,106,.5);color:var(--gold);}
  .turnbanner.wait{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--muted);}
  .bidx{display:flex;align-items:center;gap:6px;}
  .conn{font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;background:rgba(239,68,68,.15);color:#fca5a5;}
  .conn.ok{background:rgba(52,211,153,.12);color:#6ee7b7;}


  /* ---------- selector joc (home) ---------- */
  .gamepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 4px;}
  .gp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 8px;border-radius:14px;
    background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.09);color:var(--muted);

<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   Remi Online — client
   ===================================================================== */
const COLORS = ["R","Y","B","K"];
const COLOR_NAME = {R:"roșu", Y:"galben", B:"albastru", K:"negru", J:"joker"};
const LS = {
  name: "remi.name",
  server: "remi.server",
  session: "remi.session",
  sound: "remi.sound",
};

const ANDROID = (typeof window.AndroidBridge !== "undefined");
function vibrate(ms){
  try{
    if (ANDROID && window.AndroidBridge.vibrate) window.AndroidBridge.vibrate(ms);
    else if (navigator.vibrate) navigator.vibrate(ms);
  }catch(e){}
}
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------------------- piese ---------------------------- */
function tileInfo(id){
  if (id === null || id === undefined) return {c:"J", v:0, joker:true};
  if (id >= 104) return {c:"J", v:0, joker:true};
  const ci = Math.floor(id/26), r = id%26;
  return {c: COLORS[ci], v: Math.floor(r/2)+1, joker:false};
}
function tileValue(id){
  const t = tileInfo(id);
  if (t.joker) return 50;
  if (t.v === 1) return 25;
  return t.v >= 10 ? 10 : 5;
}
function plainVal(v){ return v>=10?10:5; }

/* ------------------- validare formatii (client) ------------------- */
function seqExpansions(orderVals, jokers){
  const n = orderVals.length + jokers;
  const out = [];
  for (let start=1; start<=13; start++){
    const end = start + n - 1;
    if (end > 14) continue;
    const expected = [];
    for (let v=start; v<=end; v++) expected.push(v);
    let pi = 0, ok = true;
    const positions = [];
    for (const v of orderVals){
      let found = -1;
      while (pi < expected.length){
        if (expected[pi] === v){ found = pi; pi++; break; }
        pi++;
      }
      if (found < 0){ ok = false; break; }
      positions.push(found);
    }
    if (!ok) continue;
    const used = new Set(positions);
    const jokerVals = expected.filter((_,i)=>!used.has(i));
    if (jokerVals.length !== jokers) continue;
    out.push(expected);
  }
  return out;
}
function resolveSequence(tiles){
  const n = tiles.length;
  if (n < 3 || n > 13) return null;
  const nat = tiles.filter(t=>!tileInfo(t).joker);
  const jokers = n - nat.length;
  if (nat.length < 1) return null;
  if (jokers && nat.length < 2) return null;
  if (jokers >= 2 && n < 6) return null;
  const colors = new Set(nat.map(t=>tileInfo(t).c));
  if (colors.size !== 1) return null;
  const nums = nat.map(t=>tileInfo(t).v);
  if (nums.filter(v=>v===1).length > 1) return null;
  const variants = [];
  if (nums.includes(1)){
    variants.push([...nums].sort((a,b)=>a-b));
    if (nums.includes(12) && nums.includes(13)){
      variants.push([...nums.filter(v=>v!==1)].sort((a,b)=>a-b).concat([14]));
    }
  } else variants.push([...nums].sort((a,b)=>a-b));
  let best = null;
  for (const order of variants){
    for (const expected of seqExpansions(order, jokers)){
      const pts = expected.reduce((s,v)=>s+(v>=10?10:5), 0);
      if (!best || pts > best.pts) best = {pts, expected};
    }
  }
  if (!best) return null;
  const expected = best.expected;
  const valPos = new Map();
  expected.forEach((v,i)=>{ if(!valPos.has(v)) valPos.set(v,[]); valPos.get(v).push(i); });
  const eff = new Array(n).fill(null);
  const used = new Array(expected.length).fill(false);
  const natIdx = tiles.map((t,i)=>i).filter(i=>!tileInfo(tiles[i]).joker);
  const orderKey = i => {
    const v = tileInfo(tiles[i]).v;
    if (v===1 && valPos.has(14) && !valPos.has(1)) return 15;
    return v;
  };
  natIdx.sort((a,b)=>orderKey(a)-orderKey(b));
  for (const i of natIdx){
    const v = tileInfo(tiles[i]).v;
    let cand = null;
    if (valPos.get(v) && valPos.get(v).length) cand = valPos.get(v).shift();
    else if (v===1 && valPos.get(14) && valPos.get(14).length) cand = valPos.get(14).shift();
    if (cand === null) return null;
    eff[i] = expected[cand]===14 ? 1 : tileInfo(tiles[i]).v;
    used[cand] = true;
  }
  const free = expected.filter((_,i)=>!used[i]);
  let ji = 0;
  for (let i=0;i<n;i++){
    if (tileInfo(tiles[i]).joker){
      if (ji >= free.length) return null;
      eff[i] = free[ji]===14 ? 1 : free[ji];
      ji++;
    }
  }
  return {eff, pts: best.pts};
}
function resolveSet(tiles){
  const n = tiles.length;
  if (n < 3 || n > 4) return null;
  const nat = tiles.filter(t=>!tileInfo(t).joker);
  const jokers = n - nat.length;
  if (nat.length < 2 || jokers > 1) return null;
  const vals = new Set(nat.map(t=>tileInfo(t).v));
  if (vals.size !== 1) return null;
  const val = [...vals][0];
  const colors = nat.map(t=>tileInfo(t).c);
  if (new Set(colors).size !== colors.length) return null;
  const available = COLORS.filter(c=>!colors.includes(c));
  if (jokers > available.length) return null;
  const eff = tiles.map(t=>tileInfo(t).joker?val:tileInfo(t).v);
  const pts = (val===1?25:plainVal(val))*n;
  return {eff, pts};
}
function resolveGroup(tiles){
  if (!tiles || !tiles.length) return null;
  if (new Set(tiles).size !== tiles.length) return null;
  const s = resolveSequence(tiles);
  if (s) return {type:"seq", ...s};
  const t = resolveSet(tiles);
  if (t) return {type:"set", ...t};
  return null;
}
/* imparte o selectie in cat mai multe formatii valide (piesele ramase sunt ignorate) */
let _rgCache = new Map();
function _rgKey(tiles){ return [...tiles].sort((a,b)=>a-b).join(","); }
function _resolveCached(tiles){
  const k = _rgKey(tiles);
  if (_rgCache.has(k)) return _rgCache.get(k);
  const r = resolveGroup(tiles);
  if (_rgCache.size > 4000) _rgCache.clear();
  _rgCache.set(k, r);
  return r;
}
let _partCache = new Map();
function partitionGroups(tiles){
  if (!tiles || !tiles.length) return null;
  const all = [...tiles].sort((a,b)=>a-b);
  const ck = all.join(",");
  if (_partCache.has(ck)) return _partCache.get(ck);
  const result = _partitionGroupsInner(all);
  if (_partCache.size > 300) _partCache.clear();
  _partCache.set(ck, result);
  return result;
}
function _partitionGroupsInner(all){
  let tiles = all;
  let best = {covered: 0, groups: [], pts: 0};
  let nodes = 0;
  const LIMIT = all.length > 9 ? 6000 : 14000;
  const rec = (remaining, acc, covered, pts) => {
    if (++nodes > LIMIT) return;
    if (covered > best.covered ||
        (covered === best.covered && pts > best.pts) ||
        (covered === best.covered && pts === best.pts && acc.length > best.groups.length)){
      best = {covered, groups: acc.slice(), pts};
    }
    if (!remaining.length) return;
    const first = remaining[0];
    // varianta 1: prima piesa intra intr-o formatie noua
    const others = remaining.filter(t=>t!==first);
    for (let size=2; size<=Math.min(others.length, 12); size++){
      for (const combo of combinations(others, size)){
        const g = [first, ...combo];
        const r = _resolveCached(g);
        if (!r) continue;
        const rest = remaining.filter(t=>!g.includes(t));
        rec(rest, acc.concat([g]), covered + g.length, pts + r.pts);
      }
    }
    // varianta 2: prima piesa ramane pe masa (nu face parte din selectie)
    rec(others, acc, covered, pts);
  };
  rec(all, [], 0, 0);
  if (!best.groups.length) return null;
  return best.groups;
}
function combinations(arr, k){
  const out = [];
  const rec = (start, cur) => {
    if (cur.length === k){ out.push([...cur]); return; }
    for (let i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1,cur); cur.pop(); }
  };
  rec(0, []);
  return out;
}
function groupsPoints(groups){
  let pts = 0, hasSeq = false;
  for (const g of groups){
    const r = resolveGroup(g);
    if (!r) return {ok:false};
    pts += r.pts;
    if (r.type === "seq") hasSeq = true;
  }
  return {ok:true, pts, hasSeq};
}
function canAddToGroup(groupTiles, tile, type){
  const tries = type === "seq" ? [groupTiles.concat([tile]), [tile].concat(groupTiles)] : [groupTiles.concat([tile])];
  for (const cand of tries){
    const r = resolveGroup(cand);
    if (r && r.type === type) return true;
  }
  return false;
}
function canSwapJoker(groupTiles, tile){
  if (tileInfo(tile).joker) return false;
  const idx = groupTiles.findIndex(t=>tileInfo(t).joker);
  if (idx < 0) return false;
  const cand = [...groupTiles];
  cand[idx] = tile;
  return !!resolveGroup(cand);
}

/* ---------------------------- stare ---------------------------- */
let S = null;
let YOU = null;
let session = loadSession();
let sel = new Set();
let ui = {
  screen: "boot",
  joinCode: "",
  targetMode: false,
  chatOpen: false,
  menuOpen: false,
  lastChatCount: 0,
  connected: false,
  lastV: -1,
  pollAbort: null,
  sound: localStorage.getItem(LS.sound) !== "0",
  myTurnNotified: false,
};
let pendingStart = false;
let gameSel = localStorage.getItem("remi.game") || "remi";

function loadSession(){
  try { return JSON.parse(localStorage.getItem(LS.session) || "null"); } catch(e){ return null; }
}
function saveSession(s){ localStorage.setItem(LS.session, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(LS.session); }

function apiBase(){
  if (location.protocol === "http:" || location.protocol === "https:") return "";
  return (localStorage.getItem(LS.server) || "").replace(/\/+$/,"");
}
function serverUrl(){ return apiBase() || location.origin; }

async function api(path, body){
  const base = apiBase();
  if (!base && location.protocol === "file:"){
    throw new Error("Setează adresa serverului de joc (secțiunea „Server de joc”).");
  }
  const url = base ? base + path : path;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 40000);
  try{
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=UTF-8"},
      body: JSON.stringify(body || {}),
      signal: ctrl.signal,
    });
    const data = await res.json().catch(()=>({error:"Răspuns invalid de la server"}));
    if (!res.ok && data.error) throw new Error(data.error);
    return data;
  } finally { clearTimeout(timer); }
}

/* ---------------------------- sunete ---------------------------- */
let audioCtx = null;
function beep(freq=440, dur=0.05, type="sine", vol=0.04){
  if (!ui.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
const sfx = {
  draw: ()=>beep(320,.05,"triangle",.05),
  discard: ()=>beep(220,.06,"triangle",.05),
  meld: ()=>{beep(520,.07,"sine",.06); setTimeout(()=>beep(720,.09,"sine",.05),70);},
  yourturn: ()=>{beep(660,.08,"sine",.06); setTimeout(()=>beep(880,.1,"sine",.05),90);},
  win: ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12,"sine",.06), i*110));},
  err: ()=>beep(140,.12,"sawtooth",.05),
};

/* ---------------------------- toast ---------------------------- */
let toastTimer = [];
function toast(msg, kind=""){
  const wrap = $("#toasts");
  if (!wrap) return;
  // un singur mesaj odata: il inlocuim pe cel vechi
  wrap.innerHTML = "";
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; }, 2200);
  setTimeout(()=>el.remove(), 2600);
}

/* ---------------------------- polling ---------------------------- */
async function pollLoop(){
  while (true){
    if (!session || !session.code || !session.token){
      await sleep(500);
      continue;
    }
    if (ui.pollAbort) ui.pollAbort.abort();
    ui.pollAbort = new AbortController();
    try{
      const base = apiBase();
      const url = `${base}/api/state?code=${encodeURIComponent(session.code)}&token=${encodeURIComponent(session.token)}&v=${ui.lastV}`;
      const res = await fetch(url, {signal: ui.pollAbort.signal});
      const data = await res.json();
      if (data.error){
        if (res.status === 401 || res.status === 404){
          toast(data.error, "err");
          if (S) { /* camara inchisa */ }
          clearSession(); session = null; S = null; YOU = null;
          ui.screen = "home"; render();
          await sleep(1500);
        }
        continue;
      }
      ui.connected = true;
      if (data.state){
        const fresh = data.state.v !== ui.lastV;
        ui.lastV = data.state.v;
        S = data.state;
        YOU = data.you;
        if (fresh) onNewState();
      }
    }catch(e){
      if (e.name !== "AbortError"){
        ui.connected = false;
        render();
        await sleep(1800);
      }
    }
  }
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function onNewState(){
  const meP = S.players.find(p=>p.id===YOU);
  // curata selectia de piese care nu mai sunt in mana
  if (meP && S.me){
    const hand = new Set(S.me.hand);
    for (const t of [...sel]) if (!hand.has(t)) sel.delete(t);
  }
  // sunet cand incepe tura mea
  const myTurn = S.me && S.me.isTurn && S.phase === "playing";
  if (myTurn && !ui.myTurnNotified){ ui.myTurnNotified = true; sfx.yourturn(); }
  if (!myTurn) ui.myTurnNotified = false;
  if (S.phase === "round_end" || S.phase === "game_over"){
    if (S.roundScores && (!ui.lastRoundShown || ui.lastRoundShown !== S.round + ":" + S.roundScores.reason)){
      ui.lastRoundShown = S.round + ":" + S.roundScores.reason;
      if (S.roundScores.reason === "close" || S.roundScores.reason === "meld_all") sfx.win();
    }
  }
  // raspunde la start
  if (pendingStart){ pendingStart = false; }
  // chat nou
  if (S.chat.length > ui.lastChatCount && ui.lastChatCount > 0 && !ui.chatOpen){
    toast("💬 " + S.chat[S.chat.length-1].name + ": " + S.chat[S.chat.length-1].text);
  }
  ui.lastChatCount = S.chat.length;
  if (S.phase === "playing" && ui.screen !== "game") ui.screen = "game";
  if (S.phase === "lobby" && ui.screen !== "lobby") ui.screen = "lobby";
  if (S.phase === "round_end" && ui.screen !== "game") ui.screen = "game";
  if (S.phase === "game_over" && ui.screen !== "game") ui.screen = "game";
  render();
}

/* ---------------------------- render ---------------------------- */
function fitCheck(){
  const app = $("#app");
  const scr = app.firstElementChild;
  if (!scr) return;
  let scale = parseFloat(app.dataset.fit || "1");
  // reseteaza si masoara
  scr.style.fontSize = "";
  const vh = app.clientHeight;
  if (scr.scrollHeight > vh + 2 || scr.scrollWidth > app.clientWidth + 2){
    scale = Math.max(0.72, scale * 0.94);
  } else if (scale < 1){
    scale = Math.min(1, scale * 1.04);
  }
  app.dataset.fit = scale.toFixed(3);
  if (scale < 0.999){
    scr.style.fontSize = (16 * scale).toFixed(2) + "px";
  }
}

function render(){
  const app = $("#app");
  if (!session || !session.token){
    app.innerHTML = renderHome();
    bindHome();
    requestAnimationFrame(fitCheck);
    return;
  }
  if (!S){
    app.innerHTML = `<div class="home-wrap"><div class="home"><div class="brand">Remi<small>ONLINE</small></div>
      <p class="tag">Se conectează la masă…</p><button class="linkbtn" onclick="logout()">Anulează</button></div></div>`;
    return;
  }
  if (S.game === "table"){
    app.innerHTML = renderTableGame();
    bindTableGame();
    requestAnimationFrame(fitCheck);
    return;
  }
  app.innerHTML = renderGame();
  bindGame();
  requestAnimationFrame(fitCheck);
}

function renderGame(){

        ${S.atuTile !== null && S.atuTile !== undefined ? tileHTML(S.atuTile, {size:"md", data:`data-group="atu"`}) : `<div class="tile md back"></div>`}
        <span class="lbl">Atu</span>
      </div>
      <div class="pile discard">
        <div class="deck ${me.canTakeDiscard?"glow":""}" id="pileDiscard" title="Ia piesa de jos">
          ${S.discardTop !== null && S.discardTop !== undefined
            ? `<div style="position:absolute;inset:0;transform:scale(.98)">${tileHTML(S.discardTop,{size:"lg"})}</div>`
            : `<div class="back" style="opacity:.25"></div>`}
          <span class="count">${S.discardCount}</span>
        </div>

function handHint(me){
  if (S.phase !== "playing") return "";
  if (!S.me) return "";
  const n = (me.hand||[]).length;
  if (!me.isTurn){
    return `<span>${n} piese în mână</span>`;
  }
  if (!me.drew && me.canDraw) return `<span>👉 Apasă oriunde pe masă pentru a trage o piesă</span>`;
  const canMeldNow = !!(me.canMeld);
  if (sel.size === 0) return `<span>${canMeldNow ? "Selectează piese pentru a etala / lipi" : "Apasă de două ori pe o piesă ca să o arunci"}</span>`;
  const groups = partitionGroups([...sel]);
  if (!groups){
    return `<span>${sel.size} piese selectate · formație incompletă</span>`;
  }
  const info = groupsPoints(groups);
  if (!info.ok) return `<span>formație invalidă</span>`;
  const used = groups.reduce((n,g)=>n+g.length, 0);
  const left = sel.size - used;
  const need = (!me.firstMeld && me.canMeld) ? ` · minim 45p${info.hasSeq?"":" + suită"}` : "";
  const leftTxt = left > 0 ? ` · ${left} rămân în mână` : "";
  return `<span>${groups.length} formație/formații · <span class="pts">${info.pts}p</span>${need}${leftTxt}</span>`;
}

function actionButtons(me){
  if (S.phase === "round_end"){
    return `<button class="btn ghost" id="btnShowResults">📊 Rezultate</button>
      <button class="btn primary" id="btnNextRound2">Runda următoare${S.nextRoundIn?` (${S.nextRoundIn}s)`:""}</button>`;
  }
  if (S.phase === "game_over"){
    return `<button class="btn ghost" id="btnShowResults">📊 Rezultate</button>
      <button class="btn primary" id="btnNewGame2">🎲 Joc nou</button>`;
  }
  if (S.phase !== "playing") return `<button class="btn" disabled>${S.phase==="lobby"?"În lobby":"Runda s-a încheiat"}</button>`;
  const myTurn = me.isTurn;
  const btns = [];
  const selArr = [...sel];
  if (!myTurn){
    return `<button class="btn" disabled>Așteaptă rândul tău…</button>
      <button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`;
  }
  if (!me.drew){
    btns.push(`<button class="btn primary" id="btnDraw">🃏 Trage piesă</button>`);
    if (me.canTakeDiscard) btns.push(`<button class="btn gold-outline" id="btnTakeDiscard">Ia piesa de jos</button>`);
    btns.push(`<button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`);
    return btns.join("");
  }
  // a tras
  if (sel.size > 0){
    const groups = partitionGroups(selArr);
    const info = groups ? groupsPoints(groups) : null;
    const valid = !!(groups && info && info.ok);
    const canMeldHere = me.canMeld && valid && (me.firstMeld || (info.pts >= 45 && info.hasSeq));
    if (canMeldHere){
      btns.push(`<button class="btn primary" id="btnMeld">Etalează ${info.pts}p</button>`);
    } else if (sel.size === 1 && me.canMeld && me.firstMeld){
      const canAdd = (S.groups||[]).some(g=>canAddToGroup(g.tiles.map(x=>x.t), selArr[0], g.type));
      const canSwap = (S.groups||[]).some(g=>canSwapJoker(g.tiles.map(x=>x.t), selArr[0]));
      if (canAdd || canSwap) btns.push(`<button class="btn gold-outline" id="btnTarget">Lipește la o formație</button>`);
    } else if (valid && !me.firstMeld){
      let msg = "Etalează";
      if (!me.canMeld) msg = "Etalarea e posibilă din tura a 2-a";
      else if (!info.hasSeq) msg = "Prima etalare cere o suită";
      else if (info.pts < 45) msg = `Mai ai nevoie de ${45 - info.pts}p pentru etalare`;
      btns.push(`<button class="btn ghost" disabled>${msg}</button>`);
    }
    if (sel.size === 1){
      const t = selArr[0];
      btns.push(`<button class="btn ${me.canClose?"danger":""}" id="btnDiscard">${me.canClose?"🏁 Închide":"Aruncă"}</button>`);
    }
    btns.push(`<button class="btn ghost small" id="btnClear" style="flex:0 0 auto" title="Deselectează">✕</button>`);
    return btns.join("");
  }
  const hintMsg = me.canClose ? "Apasă pe ultima piesă și închide runda!"
    : (me.canMeld ? "Selectează piesele pentru a etala" : "Selectează o piesă și aruncă (dublu-tap)");
  btns.push(`<button class="btn ghost" disabled>${hintMsg}</button>`);
  btns.push(`<button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`);
  return btns.join("");
}

  const onTile = (el) => {
    const id = Number(el.dataset.tile);
    vibrate(6);
    if (ui.targetMode) return;
    if (sel.has(id)) sel.delete(id);

      if (sel.size >= 14){ toast("Selectează maximum 14 piese odată."); return; }

    el.addEventListener("click", ()=>onTile(el));
  });
  const stock = $("#pileStock");
  if (stock && S.me && S.me.canDraw) stock.onclick = ()=>act({type:"draw_stock"}, "draw");
  const pz = $("#pileZone");
  if (pz && S.me && S.me.canDraw) pz.onclick = ()=>act({type:"draw_stock"}, "draw");

  b("#btnClear", ()=>{ sel.clear(); ui.targetMode=false; render(); });
  b("#btnChatQuick", ()=>{ ui.chatOpen = true; render(); });
  b("#btnMenu", ()=>{ ui.menuOpen = true; render(); });
  b("#btnAtu", ()=>act({type:"announce_atu"}, "meld"));
  b("#btnMeld", ()=>{
    const groups = partitionGroups([...sel]);
    if (!groups) return;
    act({type:"meld", groups}, "meld");

  b("#btnDiscard", ()=>{
    const t = [...sel][0];

  });
  b("#btnTarget", ()=>{
    ui.targetMode = true;
    toast("Alege formația la care vrei să lipești piesa.");
    render();
  });
  // lipire la formatie (modul tinta)
  if (ui.targetMode && sel.size === 1){
    const tile = [...sel][0];

        });
      };
    });
  }
  // dublu-tap = arunca

function sessBody(){ return {code: session.code, token: session.token}; }

async function act(action, sfxName, onError){
  // optimist: sunet + trimitere
  try{
    await api("/api/action", {...sessBody(), action});
    if (sfxName && sfx[sfxName]) sfx[sfxName]();
    sel.clear(); ui.targetMode = false;
    await refreshNow();
  }catch(e){
    toast(e.message || "Acțiune invalidă", "err");
    sfx.err();
    if (onError) return onError(e);
    render();
  }
}
async function refreshNow(){
  try{
    const base = apiBase();
    const res = await fetch(`${base}/api/state?code=${encodeURIComponent(session.code)}&token=${encodeURIComponent(session.token)}&v=-1`);
    const data = await res.json();
    if (data.state){
      ui.lastV = data.state.v;
      S = data.state; YOU = data.you;
      if (S.phase==="playing" && ui.screen!=="game") ui.screen="game";
      if (S.phase==="lobby" && ui.screen!=="lobby") ui.screen="lobby";
      render();
    }
  }catch(e){}
}
async function sendChat(text){
  try{ await api("/api/chat", {...sessBody(), text}); await refreshNow(); }catch(e){}
}
async function leaveGame(){
  try{ await api("/api/leave", sessBody()); }catch(e){}
  clearSession(); session=null; S=null; YOU=null; ui.lastV=-1; ui.screen="home"; render();

let tSel = null;          // punct selectat (1..24) sau "bar"
let tLastV = -1;

function dicePips(v){
  const map = {
    1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]
  };
  const on = new Set(map[v] || []);
  let html = "";
  for (let i=0;i<9;i++) html += `<i class="${on.has(i)?"on":""}"></i>`;
  return `<div class="die">${html}</div>`;
}
function mySeat(){ return S.mySeat; }
function myColorHex(){ return S.mySeat === 0 ? "alb" : "negru"; }

function pointHasMyChecker(pt){
  const cell = (S.board||[]).find(c=>c.i===pt);
  if (!cell) return false;
  return cell.owner === S.mySeat;
}

function legalTargetsFrom(from){
  const set = new Set();
  for (const mv of (S.legalMoves||[])){
    if (String(mv.from) === String(from)) set.add(String(mv.to));
  }
  return set;
}
function canMoveFrom(from){
  return (S.legalMoves||[]).some(mv=>String(mv.from) === String(from));
}

function tPointHTML(pt, side){
  const cell = (S.board||[]).find(c=>c.i===pt);
  const owner = cell ? cell.owner : null;
  const count = cell ? cell.count : 0;
  const targets = tSel !== null ? legalTargetsFrom(tSel) : new Set();
  const isTarget = targets.has(String(pt));
  const sel = String(tSel) === String(pt);
  const cls = [
    "point", side,
    sel ? "selpt" : "",
    isTarget ? "target" : "",
  ].join(" ");
  const shown = Math.min(count, 5);
  const chips = [];
  for (let k=0;k<shown;k++){
    chips.push(`<div class="chk ${owner===0?"w":"b"}"></div>`);
  }
  return `<div class="${cls}" data-pt="${pt}">
    <div class="tri ${pt%2 ? "c1" : "c2"}"></div>
    <div class="stack">${chips.join("")}</div>
    ${count>5?`<span class="pcnt">${count}</span>`:""}
    <span class="plabel">${pt}</span>
  </div>`;
}

function barChips(seat, cls){
  const n = (S.bar||[0,0])[seat] || 0;
  const out = [];
  for (let i=0;i<Math.min(n,6);i++) out.push(`<div class="chk ${cls}"></div>`);
  return out.join("");
}

function bindTableGame(){
  const b = (id, fn)=>{ const el = $(id); if (el) el.onclick = fn; };
  b("#btnRoll", ()=>act({type:"roll"}, "draw"));
  b("#btnClearSel", ()=>{ tSel = null; render(); });
  b("#btnChatQuickT", ()=>{ ui.chatOpen = true; render(); });
  b("#btnMenu", ()=>{ ui.menuOpen = true; render(); });
  b("#btnCloseModal", ()=>{ ui.chatOpen=false; ui.menuOpen=false; render(); });
  b("#btnChat", ()=>{ ui.chatOpen = true; ui.menuOpen=false; render(); });
  b("#btnRules2", ()=>showRules());
  b("#btnLeave", ()=>{ if (confirm("Ieși din joc?")) leaveGame(); });
  b("#btnSound", ()=>{ ui.sound = !ui.sound; localStorage.setItem(LS.sound, ui.sound?"1":"0"); toast(ui.sound?"Sunet pornit":"Sunet oprit"); render(); });
  b("#btnNextLeg", ()=>act({type:"next_leg"}, null));
  b("#btnNewMatch", ()=>act({type:"new_match"}, null));
  b("#btnHideLeg", ()=>{ ui.hideLeg = S.leg; render(); });
  const chatForm = $("#chatForm");
  if (chatForm){
    chatForm.onsubmit = (e)=>{ e.preventDefault(); const inp=$("#chatInput"); const t=(inp.value||"").trim();
      if (!t) return; inp.value=""; ui.chatDraft=""; sendChat(t); };
  }
  $$(".quick button").forEach(el=>{ el.onclick = ()=>sendChat(el.dataset.msg || el.textContent); });

  const onPoint = async (pt)=>{
    if (!S.myTurn) return;
    if (tSel === null){
      if (pointHasMyChecker(pt) && canMoveFrom(pt)){ tSel = pt; render(); }
      return;
    }
    if (String(tSel) === String(pt)){ tSel = null; render(); return; }
    const isLegal = legalTargetsFrom(tSel).has(String(pt));
    if (isLegal){
      const from = tSel;
      tSel = null;
      await act({type:"move", from: from === "bar" ? "bar" : Number(from), to: Number(pt)}, "discard");
      return;
    }
    if (pointHasMyChecker(pt) && canMoveFrom(pt)){ tSel = pt; render(); return; }
    tSel = null; render();
  };
  $$("#app .point").forEach(el=>{
    el.onclick = ()=>onPoint(Number(el.dataset.pt));
  });
  const bw = $("#tbarWhite");
  if (bw && bw.dataset.pickBar){
    bw.onclick = ()=>{ tSel = "bar"; render(); };
  }
  const offTray = $(".tray." + (mySeat()===0 ? "w" : "b"));
  if (offTray){
    offTray.onclick = async ()=>{
      if (!S.myTurn || tSel === null) return;
      if (!legalTargetsFrom(tSel).has("off")) return;
      const from = tSel; tSel = null;
      await act({type:"move", from: from==="bar"?"bar":Number(from), to:"off"}, "meld");
    };
  }
}

    <p class="tag">${closer ? `${esc(closer.name)} a închis jocul${rs.closing_tile!==null&&rs.closing_tile!==undefined?` cu ${tileLabel(rs.closing_tile)}`:""}.` : "Grămada s-a terminat."}</p>
    ${scoreRows()}
    <div class="mfoot">
      <button class="btn" id="btnCloseResults">Vezi masa</button>
      <button class="btn primary" id="btnNextRound">Runda următoare ${S.nextRoundIn?`(${S.nextRoundIn}s)`:""}</button>
    </div>
  </div></div>`;
}
function renderGameOver(){
  const w = playerById(S.winnerPid);
  return `<div class="modal-wrap"><div class="modal">
    <div class="bigwin">👑</div>
    <h2 style="text-align:center">${esc(w?w.name:"Cineva")} a câștigat!</h2>
    <p class="tag" style="text-align:center">Scor final — ținta era ${S.opts.target} puncte</p>
    ${scoreRows()}

      <button class="btn primary" id="btnNewGame">Joc nou</button>

function tileLabel(id){
  const t = tileInfo(id);
  if (t.joker) return "un joker";
  const names = {R:"roșu",Y:"galben",B:"albastru",K:"negru"};
  return `${t.v} ${names[t.c]}`;
}

function showRules(tab){
  const active = tab || (S && S.game === "table" ? "table" : "remi");
  const TABLE_RULES_HTML = `
    <h2>📖 Regulile jocului — Table (backgammon)</h2>
    <p class="tag">15 piese · 2 jucători · zaruri · meci în puncte</p>
    <h3>Scopul</h3>

      <li>Fiecare jucător are <b>15 piese</b>. Trebuie să-ți scoți toate piesele de pe tablă înaintea adversarului.</li>
      <li>Piesele albe merg <b>descrescător</b> (24 → 1) și se scot din punctele 1–6; cele negre merg <b>crescător</b> (1 → 24) și se scot din 19–24.</li>
    </ul>
    <h3>Desfășurarea</h3>
    <ul>
      <li>La rândul tău arunci <b>două zaruri</b> și muți piesele cu valorile obținute (fiecare zar o mutare).</li>
      <li><b>Dublu</b> (ex. 5-5) înseamnă <b>patru mutări</b> de aceeași valoare.</li>
      <li>Poți muta doar într-un punct <b>liber</b>, ocupat de piesele tale sau ocupat de <b>o singură</b> piesă a adversarului — pe care o <b>lovesc</b>i.</li>
      <li>Piesa lovită merge pe <b>bară</b> și trebuie reintrodusă înainte de orice altă mutare.</li>
      <li>Nu poți muta dacă nu ai mutări legale — predai tura.</li>
    </ul>
    <h3>Scoaterea pieselor</h3>
    <ul>
      <li>Când <b>toate</b> piesele tale sunt în casa ta (1–6 pentru alb, 19–24 pentru negru), începi să le scoți.</li>
      <li>Un zar scoate o piesă aflată exact la distanța respectivă; un zar mai mare poate scoate cea mai îndepărtată piesă.</li>
    </ul>
    <h3>Punctaj</h3>
    <ul>
      <li><b>Leg câștigat simplu:</b> 1 punct.</li>
      <li><b>Gammon:</b> adversarul nu a scos nicio piesă — <b>2 puncte</b>.</li>
      <li><b>Backgammon:</b> adversarul nu a scos nicio piesă și are piese pe bară sau în casa ta — <b>3 puncte</b>.</li>
      <li>Meciul se joacă până la numărul de puncte ales de gazdă (implicit 5).</li>
    </ul>
    <h3>Control</h3>
    <ul>
      <li>Apasă <b>Aruncă zarurile</b>, apoi atinge piesa ta și punctul evidențiat (destinație).</li>
      <li>Pentru a reintra de pe bară, atinge <b>BARĂ</b> (zona ta) și apoi punctul de intrare evidențiat.</li>
      <li>Pentru a scoate o piesă, atinge piesa și apoi zona <b>„scoase”</b> a ta, evidențiată cu verde.</li>
    </ul>`;

  const html = `<div class="overlay" id="rulesOverlay"><div class="modal-wrap"><div class="modal">
    <button class="close-x" onclick="document.getElementById('rulesOverlay').remove()">×</button>
    <div class="gamepick" style="margin-bottom:10px">
      <button class="gp ${active==='remi'?'on':''}" onclick="document.getElementById('rulesOverlay').remove(); showRules('remi')">
        <span class="ico">🃏</span><b>Remi Etalat</b>
      </button>
      <button class="gp ${active==='table'?'on':''}" onclick="document.getElementById('rulesOverlay').remove(); showRules('table')">
        <span class="ico">🎲</span><b>Table</b>
      </button>
    </div>
    ${active === 'table' ? TABLE_RULES_HTML : `<h2>📖 Regulile jocului — Remi Etalat</h2>`}
    <p class="tag">Rummy 45 · 106 piese · 2 jokeri · 2–4 jucători</p>
    <h3>Piesele și valorile</h3>
    <ul>
      <li>4 culori (roșu, galben, albastru, negru), piese 1–13, fiecare de două ori + 2 jokeri.</li>
      <li>Piesele <b>2–9</b> valorează <b>5 puncte</b>, piesele <b>10–13</b> valorează <b>10 puncte</b>.</li>

      <li><b>Prima etalare</b> trebuie să valoreze minim <b>45 de puncte</b> și să conțină cel puțin o <b>suită</b>. Nu se poate etala în prima tură a jocului.</li>
      <li>După etalare poți lipi piese la orice formație de pe masă și poți înlocui un joker cu piesa reală (jokerul îți rămâne în mână).</li>

  const div = document.createElement("div");
  div.innerHTML = html;
  document.body.appendChild(div.firstElementChild);
}

function showServerSetup(){
  if (document.getElementById("srvOverlay")) return;
  const div = document.createElement("div");
  div.innerHTML = `<div class="overlay" id="srvOverlay"><div class="modal-wrap"><div class="modal">
    <h2>🎲 Bine ai venit la Remi Online!</h2>
    <p>Introdu adresa serverului de joc pentru a te putea conecta la mese.</p>
    <ul style="font-size:13px">
      <li><b>Acasă / aceeași rețea Wi-Fi:</b> pornește serverul pe calculator și scrie adresa lui, ex. <b>http://192.168.1.10:8080</b></li>
      <li><b>Online:</b> adresa serverului găzduit, ex. <b>https://remi.exemplu.ro</b></li>
    </ul>
    <input class="inp" id="srvSetupInput" placeholder="http://192.168.1.10:8080" autocomplete="off">
    <div class="mfoot">
      <button class="btn" id="srvSetupLater">Mai târziu</button>
      <button class="btn primary" id="srvSetupSave">Conectează</button>
    </div>
    <div class="tag" id="srvSetupMsg" style="font-size:12px;margin-top:8px"></div>
  </div></div></div>`;
  document.body.appendChild(div.firstElementChild);
  const inp = document.getElementById("srvSetupInput");
  const msg = document.getElementById("srvSetupMsg");
  inp.value = localStorage.getItem(LS.server) || "";
  document.getElementById("srvSetupLater").onclick = ()=>document.getElementById("srvOverlay").remove();
  document.getElementById("srvSetupSave").onclick = async ()=>{
    let v = (inp.value||"").trim().replace(/\/+$/,"");
    if (!v){ msg.textContent = "Scrie o adresă validă."; return; }
    if (!/^https?:\/\//.test(v)) v = "http://" + v;
    msg.textContent = "Se verifică…";
    try{
      const res = await fetch(v + "/health");
      const d = await res.json();
      if (!d.ok) throw new Error("răspuns invalid");
      localStorage.setItem(LS.server, v);
      document.getElementById("srvOverlay").remove();
      toast("✅ Conectat la server");
      render();
    }catch(e){
      msg.innerHTML = "❌ Nu pot contacta serverul. Verifică adresa și că serverul rulează.<br>Poți oricând schimba adresa din meniul principal.";
    }
  };
}

/* ---------------------------- pornire ---------------------------- */
function boot(){
  // cod din link?
  const params = new URLSearchParams(location.search);
  const code = (params.get("code") || "").toUpperCase();
  if (code) ui.joinCode = code;

  if (session && session.token){
    ui.screen = "loading";
    render();
    refreshNow();
  } else {
    ui.screen = "home";
    render();
    if (code){
      const name = localStorage.getItem(LS.name);
      if (name) joinRoom(code, name);
    }
  }
  if (ANDROID && !localStorage.getItem(LS.server)){
    setTimeout(showServerSetup, 400);
  }
  pollLoop();
  // redesenare la intoarcerea in app
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refreshNow(); });
  // timer local
  setInterval(()=>{
    const el = $("#turnCounter");
    if (el && S && S.phase === "playing"){
      const v = parseInt(el.textContent) - 1;
      if (v >= 0) el.textContent = v;
    }
    // actualizeaza bara de timp a jucatorului de la rand
    if (S && S.phase === "playing"){
      const t = $(".opp.turn .timer");
      if (t){
        const cur = parseFloat(t.style.width) || 0;
        t.style.width = Math.max(0, cur - (100/Math.max(1,S.turnSeconds))) + "%";
      }
    }
  }, 1000);
  setInterval(()=>{ if (!ui.connected && session) render(); }, 4000);
}

// legare lobby (dupa render)
const _render = render;
render = function(){
  _render();
  if (S && S.phase === "lobby"){
    const b = (id, fn)=>{ const el=$(id); if (el) el.onclick = fn; };
    b("#btnCopy", async ()=>{
      try{ await navigator.clipboard.writeText(S.code); toast("Cod copiat: " + S.code); }
      catch(e){ prompt("Copiază codul camerei:", S.code); }
    });
    b("#btnShare", async ()=>{
      const text = `Joacă Remi Online cu mine! Cod cameră: ${S.code}`;
      if (navigator.share){ try{ await navigator.share({text}); }catch(e){} }
      else { try{ await navigator.clipboard.writeText(text); toast("Invitație copiată"); }catch(e){ prompt("Trimite invitația:", text); } }
    });
    b("#btnReady", ()=>api("/api/ready", {...sessBody(), ready: !(S.players.find(p=>p.id===YOU)||{}).ready}).then(refreshNow));
    b("#btnStart", ()=>{
      pendingStart = true;
      api("/api/ready", {...sessBody(), ready:true, start:true}).then(refreshNow).catch(e=>toast(e.message,"err"));
    });
    b("#btnLeaveLobby", ()=>leaveGame());
    b("#btnLeaveTop", ()=>{ if (confirm("Ieși din cameră?")) leaveGame(); });
    b("#btnRulesTop", ()=>showRules());
    b("#btnAddTester", ()=>{
      const url = (apiBase() ? apiBase() : location.origin + location.pathname) + "?code=" + encodeURIComponent(S.code);
      if (ANDROID && window.AndroidBridge.openUrl) window.AndroidBridge.openUrl(url);
      else window.open(url, "_blank");
    });
    const upd = (sel, key, cast=Number)=>{
      const el = $(sel);
      if (el) el.onchange = ()=>{
        api("/api/action", {...sessBody(), action:{type:"update_opts", opts:{[key]: cast(el.value)}}}).catch(()=>{});
      };
    };
    upd("#optPlayers", "max_players");
    upd("#optTime", "turn_seconds");
    upd("#optTarget", "target");
  }
  const _ci = $("#chatInput");
  if (_ci) _ci.addEventListener("input", ()=>{ ui.chatDraft = _ci.value; });
  // muta chatul la ultimul mesaj
  const cm = $("#chatMsgs");
  if (cm) cm.scrollTop = cm.scrollHeight;
};

window.addEventListener("load", boot);
window.logout = function(){ clearSession(); session=null; S=null; YOU=null; ui.lastV=-1; render(); };
</script>
