function handHint(me){
  if (S.phase !== "playing") return "";
  if (!S.me) return "";
  const isTabla = (S.opts && S.opts.mode === "tabla");
  const n = (me.hand||[]).length;
  if (!me.isTurn){
    return `<span>${n} piese pe suport</span>`;
  }
  if (!me.drew && me.canDraw){
    return isTabla
      ? `<span>👉 Trage o piesă din grămadă (+) sau ia ultima piesă aruncată (←)</span>`
      : `<span>👉 Apasă pe + sau pe piesa de jos pentru a trage o piesă</span>`;
  }
  if (isTabla){
    if (sel.size === 1){
      const chosen = [...sel][0];
      if (me.drawnFrom === "discard" && me.takenDiscardTile === chosen){
        return `<span>⚠️ Nu poți arunca imediat aceeași piesă luată de jos</span>`;
      }
      const rem14 = (me.hand||[]).filter(t=>t!==chosen);
      if (rem14.length === 14 && findCompletePartition14(rem14)){
        return `<span class="pts">✨ Celelalte 14 piese formează doar suite și terțe! Apasă 🏁 Închide!</span>`;
      }
      return `<span>Apasă „Aruncă” pentru a pune piesa jos (sau mută pe suport)</span>`;
    }
    if (sel.size === 0 && (me.hand||[]).length === 15){
      const skip = (me.drawnFrom === "discard") ? me.takenDiscardTile : null;
      const closers = findTablaClosersCached(me.hand, skip);
      if (closers.length){
        return `<span class="pts">✨ Poți închide acum! Selectează piesa de aruncat (${closers.map(tileLabel).slice(0,3).join(", ")}) și apasă 🏁 Închide</span>`;
      }
      return `<span>Trage cu degetul/mouse-ul piese pe suport · selectează 1 piesă ca să o arunci</span>`;
    }
    return `<span>${sel.size} piese selectate · selectează 1 singură piesă pentru a arunca sau închide</span>`;
  }
  const canMeldNow = !!(me.canMeld);
  if (sel.size === 0) return `<span>${canMeldNow ? "Selectează piese pentru a etala / lipi" : "Selectează o piesă și apasă Aruncă"}</span>`;
  const groups = partitionGroups([...sel]);
  if (!groups){
    return `<span>${sel.size} piese selectate · formație incompletă</span>`;
  }
  const info = groupsPoints(groups);
  if (!info.ok) return `<span>formație invalidă</span>`;
  const used = groups.reduce((n,g)=>n+g.length, 0);
  const left = sel.size - used;
  const need = (!me.firstMeld && me.canMeld) ? ` · minim 45p${info.hasSeq?"":" + suită"}` : "";
  const leftTxt = left > 0 ? ` · ${left} rămân în mână` : "";
  return `<span>${groups.length} formație/formații · <span class="pts">${info.pts}p</span>${need}${leftTxt}</span>`;
}

function actionButtons(me){
  if (S.phase === "round_end"){
    return `<button class="btn ghost" id="btnShowResults">📊 Rezultate</button>
      <button class="btn primary" id="btnNextRound2">Runda următoare${S.nextRoundIn?` (${S.nextRoundIn}s)`:""}</button>`;
  }
  if (S.phase === "game_over"){
    return `<button class="btn ghost" id="btnShowResults">📊 Rezultate</button>
      <button class="btn primary" id="btnNewGame2">🎲 Joc nou</button>`;
  }
  if (S.phase !== "playing") return `<button class="btn" disabled>${S.phase==="lobby"?"În lobby":"Runda s-a încheiat"}</button>`;
  const myTurn = me.isTurn;
  const btns = [];
  const selArr = [...sel];
  if (!myTurn){
    return `<button class="btn" disabled>Așteaptă rândul tău…</button>
      <button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`;
  }
  if (!me.drew){
    btns.push(`<button class="btn primary" id="btnDraw">🃏 Trage piesă</button>`);
    if (me.canTakeDiscard) btns.push(`<button class="btn gold-outline" id="btnTakeDiscard">Ia piesa de jos</button>`);
    btns.push(`<button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`);
    return btns.join("");
  }
  // a tras
  if (sel.size > 0){
    const groups = partitionGroups(selArr);
    const info = groups ? groupsPoints(groups) : null;
    const valid = !!(groups && info && info.ok);
    const canMeldHere = me.canMeld && valid && (me.firstMeld || (info.pts >= 45 && info.hasSeq));
    if (canMeldHere){
      btns.push(`<button class="btn primary" id="btnMeld">Etalează ${info.pts}p</button>`);
    } else if (sel.size === 1 && me.canMeld && me.firstMeld){
      const canAdd = (S.groups||[]).some(g=>canAddToGroup(g.tiles.map(x=>x.t), selArr[0], g.type));
      const canSwap = (S.groups||[]).some(g=>canSwapJoker(g.tiles.map(x=>x.t), selArr[0]));
      if (canAdd || canSwap) btns.push(`<button class="btn gold-outline" id="btnTarget">Lipește la o formație</button>`);
    } else if (valid && !me.firstMeld){
      let msg = "Etalează";
      if (!me.canMeld) msg = "Etalarea e posibilă din tura a 2-a";
      else if (!info.hasSeq) msg = "Prima etalare cere o suită";
      else if (info.pts < 45) msg = `Mai ai nevoie de ${45 - info.pts}p pentru etalare`;
      btns.push(`<button class="btn ghost" disabled>${msg}</button>`);
    }
    if (sel.size === 1){
      const t = selArr[0];
      btns.push(`<button class="btn ${me.canClose?"danger":""}" id="btnDiscard">${me.canClose?"🏁 Închide":"Aruncă"}</button>`);
    }
    btns.push(`<button class="btn ghost small" id="btnClear" style="flex:0 0 auto" title="Deselectează">✕</button>`);
    return btns.join("");
  }
  const hintMsg = me.canClose ? "Apasă pe ultima piesă și închide runda!"
    : (me.canMeld ? "Selectează piesele pentru a etala" : "Selectează o piesă și aruncă (dublu-tap)");
  btns.push(`<button class="btn ghost" disabled>${hintMsg}</button>`);
  btns.push(`<button class="btn ghost small" id="btnChatQuick" style="flex:0 0 auto">💬</button>`);
  return btns.join("");
}

let _rackDragCleanup = null;
function bindGame(){
  if (_rackDragCleanup){ _rackDragCleanup(); _rackDragCleanup = null; }
  const onTile = (el) => {
    const id = Number(el.dataset.tile);
    vibrate(6);
    sfx.tileTap();
    if (ui.targetMode) return;
    if (sel.has(id)) sel.delete(id);
    else {
      if (sel.size >= 14){ toast("Selectează maximum 14 piese odată."); return; }
      sel.add(id);
    }
    render();
  };
  let dragSt = null;
  const clearDrag = () => {
    if (!dragSt) return;
    if (dragSt.ghost) dragSt.ghost.remove();
    if (dragSt.srcEl) dragSt.srcEl.classList.remove("dragging");
    if (dragSt.hoverEl) dragSt.hoverEl.classList.remove("drop-hover");
    window.removeEventListener("pointermove", onWinMove);
    window.removeEventListener("pointerup", onWinUp);
    window.removeEventListener("pointercancel", onWinCancel);
    dragSt = null;
  };
  function onWinMove(e){
    if (!dragSt || e.pointerId !== dragSt.pid) return;
    const dx = e.clientX - dragSt.sx, dy = e.clientY - dragSt.sy;
    if (!dragSt.moved){
      if (dx*dx + dy*dy < 144) return; // 12px threshold
      dragSt.moved = true;
      dragSt.srcEl.classList.add("dragging");
      const g = dragSt.srcEl.cloneNode(true);
      g.classList.remove("dragging", "sel");
      g.classList.add("drag-ghost");
      g.style.width = dragSt.w + "px";
      g.style.height = dragSt.h + "px";
      document.body.appendChild(g);
      dragSt.ghost = g;
    }
    if (dragSt.ghost){
      dragSt.ghost.style.transform = `translate3d(${(e.clientX - dragSt.ox).toFixed(1)}px, ${(e.clientY - dragSt.oy).toFixed(1)}px, 0) scale(1.08)`;
    }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slotEl = under ? under.closest(".rg-slot") : null;
    const discEl = (!slotEl && S.me && S.me.canDiscard && under) ? (under.closest("#pileDiscard") || under.closest("#btnDiscard")) : null;
    const nextHover = slotEl || discEl;
    if (dragSt.hoverEl && dragSt.hoverEl !== nextHover){
      dragSt.hoverEl.classList.remove("drop-hover");
    }
    dragSt.hoverEl = nextHover;
    if (nextHover) nextHover.classList.add("drop-hover");
  }
  function finishPointer(e, cancelled){
    if (!dragSt || e.pointerId !== dragSt.pid) return;
    const st = dragSt;
    const under = !cancelled && st.moved ? document.elementFromPoint(e.clientX, e.clientY) : null;
    const targetSlot = under ? under.closest(".rg-slot") : null;
    const targetDiscard = (!targetSlot && !cancelled && st.moved && S.me && S.me.canDiscard && under)
      ? (under.closest("#pileDiscard") || under.closest("#btnDiscard")) : null;
    clearDrag();
    if (cancelled) return;
    if (st.moved){
      if (targetSlot){
        const toIdx = Number(targetSlot.dataset.slot);
        if (Number.isInteger(toIdx) && toIdx !== st.fromIdx){
          const tmp = rRackSlots[toIdx];
          rRackSlots[toIdx] = rRackSlots[st.fromIdx];
          rRackSlots[st.fromIdx] = tmp;
          sfx.tileTap();
          render();
        }
      } else if (targetDiscard){
        const tileId = Number(st.el.dataset.tile);
        const isClose = S.me && S.me.canClose;
        if (isClose && !confirm("Închizi runda? Piesa rămasă va fi aruncată cu fața în jos.")) return;
        sel.clear();
        act({type:"discard", tile:tileId}, "discard");
      }
      return;
    }
    onTile(st.el);
  }
  function onWinUp(e){ finishPointer(e, false); }
  function onWinCancel(e){ finishPointer(e, true); }
  _rackDragCleanup = clearDrag;

  $$("#myHand .tile").forEach(el=>{
    el.addEventListener("pointerdown", (e)=>{
      if (e.button && e.button !== 0) return;
      const slot = el.closest(".rg-slot");
      if (!slot) return;
      clearDrag();
      const rect = el.getBoundingClientRect();
      dragSt = {
        pid: e.pointerId,
        el,
        srcEl: el,
        fromIdx: Number(slot.dataset.slot),
        sx: e.clientX,
        sy: e.clientY,
        ox: e.clientX - rect.left,
        oy: e.clientY - rect.top,
        w: rect.width,
        h: rect.height,
        moved: false,
        ghost: null,
        hoverEl: null,
      };
      window.addEventListener("pointermove", onWinMove);
      window.addEventListener("pointerup", onWinUp);
      window.addEventListener("pointercancel", onWinCancel);
    });
  });
  $$("#myHand .rg-slot.empty").forEach(slotEl=>{
    slotEl.addEventListener("click", ()=>{
      if (sel.size !== 1) return;
      const tileId = [...sel][0];
      const fromIdx = rRackSlots.indexOf(tileId);
      const toIdx = Number(slotEl.dataset.slot);
      if (fromIdx >= 0 && toIdx >= 0){
        rRackSlots[fromIdx] = null;
        rRackSlots[toIdx] = tileId;
        sel.clear();
        sfx.tileTap();
        render();
      }
    });
  });
  const stock = $("#pileStock");
  if (stock && S.me && S.me.canDraw) stock.onclick = ()=>act({type:"draw_stock"}, "draw");
  const disc = $("#pileDiscard");
  if (disc){
    disc.onclick = ()=>{
      if (!S.me) return;
      if (S.me.canTakeDiscard){ act({type:"draw_discard"}, "draw"); return; }
      if (S.me.canDiscard && sel.size === 1){
        const t = [...sel][0];
        const isClose = !!S.me.canClose;
        if (isClose && !confirm("Închizi runda? Piesa rămasă va fi aruncată cu fața în jos.")) return;
        sel.clear();
        act({type:"discard", tile:t}, "discard");
      }
    };
  }

  const b = (id, fn)=>{ const el = $(id); if (el) el.onclick = fn; };
  b("#btnSort777", ()=>sortRemiRack("777"));
  b("#btnSort123", ()=>sortRemiRack("123"));

  b("#btnTakeDiscard", ()=>act({type:"draw_discard"}, "draw"));
  b("#btnClear", ()=>{ sel.clear(); ui.targetMode=false; render(); });
  b("#btnChatQuick", ()=>{ ui.chatOpen = true; render(); });
  b("#btnQuickDialogR", ()=>{ rQuickOpen = !rQuickOpen; render(); });
  b("#btnQuickEmojiR", ()=>{ rQuickOpen = !rQuickOpen; render(); });
  b("#btnOpenFullChatR", ()=>{ rQuickOpen = false; ui.chatOpen = true; render(); });
  b("#btnMuteDialogR", ()=>{ tDialogMuted = !tDialogMuted; toast(tDialogMuted?"Dialog oprit":"Dialog pornit"); render(); });
  b("#btnMenu", ()=>{ rQuickOpen = false; ui.menuOpen = true; render(); });
  b("#btnAtu", ()=>act({type:"announce_atu"}, "meld"));
  b("#btnMeld", ()=>{
    if (!S.me || !S.me.isTurn || S.phase !== "playing"){ toast("Așteaptă rândul tău."); return; }
    if (!S.me.drew){ toast("Trage întâi o piesă (+)."); return; }
    if (!S.me.canMeld){ toast("Primul jucător începe cu aruncarea unei piese; etalarea începe imediat după."); return; }
    if (!sel.size){ toast("Selectează piesele pentru suită/tertă și apoi apasă Etalează."); return; }
    const groups = partitionGroups([...sel]);
    if (!groups){ toast("Piesele selectate nu formează o suită sau tertă validă.", "err"); return; }
    const info = groupsPoints(groups);
    if (!info || !info.ok){ toast("Formație invalidă.", "err"); return; }
    if (!S.me.firstMeld){
      if (!info.hasSeq){ toast("Prima etalare trebuie să conțină cel puțin o suită.", "err"); return; }
      if (info.pts < 45){ toast(`Prima etalare cere minim 45 puncte (ai ${info.pts}p).`, "err"); return; }
    }
    act({type:"meld", groups}, "meld");
  });
  b("#btnDiscard", ()=>{
    if (!S.me || !S.me.isTurn || S.phase !== "playing"){ toast("Așteaptă rândul tău."); return; }
    if (!S.me.drew){ toast("Trage întâi o piesă din grămadă (+)."); return; }
    if (sel.size !== 1){ toast("Selectează o singură piesă de aruncat (sau trage piesa direct în Aruncate)."); return; }
    const t = [...sel][0];
    if (S.opts && S.opts.mode === "tabla" && S.me.drawnFrom === "discard" && S.me.takenDiscardTile === t){
      toast("Nu poți arunca imediat aceeași piesă pe care ai luat-o de jos.", "err");
      return;
    }
    const isClose = S.me && S.me.canClose;
    if (isClose && !confirm("Închizi runda? Piesa rămasă va fi aruncată cu fața în jos.")) return;
    sel.clear();
    act({type:"discard", tile:t}, "discard");
  });
  b("#btnCloseTabla", ()=>{
    if (!S.me) return;
    const hand = S.me.hand || [];
    let chosen = sel.size === 1 ? [...sel][0] : undefined;
    if (chosen === undefined){
      const skip = (S.me.drawnFrom === "discard") ? S.me.takenDiscardTile : null;

      if (closers.length) chosen = closers[0];

      return;
    }
    if (!confirm(`Închizi runda aruncând ${tileLabel(chosen)}?`)) return;
    act({type:"close_tabla", tile:chosen}, "meld");
  });
  b("#btnTarget", ()=>{
    ui.targetMode = true;
    toast("Alege formația la care vrei să lipești piesa.");
    render();
  });
  $$("[data-rqd]").forEach(el=>{

  // lipire la formatie (modul tinta)
  if (ui.targetMode && sel.size === 1){
    const tile = [...sel][0];
    $$("#groupsArea .rg-grp.target").forEach(el=>{

function sessBody(){ return {code: session.code, token: session.token}; }

async function act(action, sfxName, onError){
  // optimist: sunet + trimitere
  try{
    await api("/api/action", {...sessBody(), action});
    if (sfxName && sfx[sfxName]) sfx[sfxName]();
    sel.clear(); ui.targetMode = false;
    await refreshNow();
  }catch(e){
    toast(e.message || "Acțiune invalidă", "err");
    sfx.err();
    if (onError) return onError(e);
    render();
  }
}
async function refreshNow(){
  if (!session || !session.code || !session.token) return;
  try{
    const base = apiBase();
    const res = await fetch(`${base}/api/state?code=${encodeURIComponent(session.code)}&token=${encodeURIComponent(session.token)}&v=-1`);
    const data = await res.json();
    if (data.error && (res.status === 401 || res.status === 404)){
      clearSession(); session = null; S = null; YOU = null;
      ui.screen = "home"; render();
      return;
    }
    if (data.state){
      ui.lastV = data.state.v;
      S = data.state; YOU = data.you;
      if (S.phase==="playing" && ui.screen!=="game") ui.screen="game";
      if (S.phase==="lobby" && ui.screen!=="lobby") ui.screen="lobby";
      render();
    }
  }catch(e){}
}
async function sendChat(text){
  try{ await api("/api/chat", {...sessBody(), text}); await refreshNow(); }catch(e){}
}
async function leaveGame(){
  try{ await api("/api/leave", sessBody()); }catch(e){}
  clearSession(); session=null; S=null; YOU=null; ui.lastV=-1; ui.screen="home"; render();
}

function dicePips(v, small=false){
  const map = {
    1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]
  };
  const on = new Set(map[v] || []);
  let html = "";
  for (let i=0;i<9;i++) html += `<i class="${on.has(i)?"on":""}"></i>`;
  return `<div class="die${small?" small":""}">${html}</div>`;
}
function mySeat(){ return S.mySeat; }
function myColorHex(){ return S.mySeat === 0 ? "alb" : "negru"; }

function calcPips(seat){
  let total = ((S.bar||[0,0])[seat] || 0) * 25;
  for (const c of (S.board||[])){
    if (c.owner === seat && c.count > 0){
      const dist = seat === 0 ? c.i : (25 - c.i);
      total += dist * c.count;
    }
  }
  return total;
}

function pointHasMyChecker(pt){
  const cell = (S.board||[]).find(c=>c.i===pt);
  if (!cell) return false;
  return cell.owner === S.mySeat;
}

function legalTargetsFrom(from){
  const set = new Set();
  for (const mv of (S.legalMoves||[])){
    if (String(mv.from) === String(from)) set.add(String(mv.to));
  }
  return set;
}
function legalDieMapFrom(from){
  const map = new Map();
  for (const mv of (S.legalMoves||[])){
    if (String(mv.from) === String(from)){
      const k = String(mv.to);
      if (!map.has(k)) map.set(k, mv.die);
    }
  }
  return map;
}
function canMoveFrom(from){
  return (S.legalMoves||[]).some(mv=>String(mv.from) === String(from));
}

function optimisticTableMove(from, to){
  if (!S) return;
  const me = mySeat();
  const mv = (S.legalMoves||[]).find(m=>String(m.from)===String(from) && String(m.to)===String(to));
  if (from === "bar"){
    S.bar[me] = Math.max(0, (S.bar[me]||0) - 1);
  } else {
    const fPt = Number(from);
    const fc = (S.board||[]).find(c=>c.i===fPt);
    if (fc){ fc.count = Math.max(0, fc.count - 1); }
    S.board = (S.board||[]).filter(c=>c.count > 0);
  }
  const stepsPath = (mv && Array.isArray(mv.path) && mv.path.length) ? mv.path : [to];
  for (let i = 0; i < stepsPath.length - 1; i++){
    const midPt = Number(stepsPath[i]);
    const mc = (S.board||[]).find(c=>c.i===midPt);
    if (mc && mc.owner !== me && mc.count === 1){
      S.bar[mc.owner] = (S.bar[mc.owner]||0) + 1;
      mc.count = 0;
    }
  }
  S.board = (S.board||[]).filter(c=>c.count > 0);
  if (to === "off"){
    S.off[me] = (S.off[me]||0) + 1;
  } else {
    const tPt = Number(to);
    let tc = (S.board||[]).find(c=>c.i===tPt);
    if (!tc){
      S.board.push({i: tPt, owner: me, count: 1});
    } else if (tc.owner === me){
      tc.count += 1;
    } else if (tc.count === 1){
      const opp = tc.owner;
      tc.owner = me; tc.count = 1;
      S.bar[opp] = (S.bar[opp]||0) + 1;
    }
  }
  // scoate zarurile folosite din previzualizare (inclusiv mutare combinată)
  const usedDice = (mv && Array.isArray(mv.dice) && mv.dice.length) ? mv.dice : [legalDieMapFrom(from).get(String(to))];
  if (Array.isArray(S.dice)){
    for (const d of usedDice){
      if (!d) continue;
      const idx = S.dice.indexOf(d);
      if (idx >= 0) S.dice.splice(idx, 1);
    }
  }
  S.legalMoves = [];
}

function tPointHTML(pt, side){
  const cell = (S.board||[]).find(c=>c.i===pt);
  const owner = cell ? cell.owner : null;
  const count = cell ? cell.count : 0;
  const dieMap = tSel !== null ? legalDieMapFrom(tSel) : new Map();
  const isTarget = dieMap.has(String(pt));
  const targetDie = dieMap.get(String(pt));
  const sel = String(tSel) === String(pt);
  const canPick = !!S.myTurn && !S.canRoll && owner === S.mySeat && canMoveFrom(pt);
  const cls = [
    "point", side,
    sel ? "selpt" : "",
    isTarget ? "target" : "",
    canPick ? "canpick" : "",
  ].filter(Boolean).join(" ");
  const shown = Math.min(count, 5);
  const dense = count > 4;
  const chips = [];
  for (let k=0;k<shown;k++){
    chips.push(`<div class="chk ${owner===0?"w":"b"}"></div>`);
  }
  if (isTarget){
    chips.push(`<div class="ghost-chk" title="Mută aici (${targetDie})">${targetDie||"●"}</div>`);
  }
  return `<div class="${cls}" data-pt="${pt}">
    <div class="tri ${pt%2 ? "c1" : "c2"}"></div>
    <div class="stack ${dense?"dense":""}">${chips.join("")}</div>
    ${count>5?`<span class="pcnt">${count}</span>`:""}
    <span class="plabel">${pt}</span>
  </div>`;
}

function barChips(seat, cls){
  const n = (S.bar||[0,0])[seat] || 0;
  const out = [];
  for (let i=0;i<Math.min(n,4);i++) out.push(`<div class="chk sm ${cls}"></div>`);
  return out.join("");
}

function offEdgesHTML(count, cls){
  const n = Math.min(15, Math.max(0, count || 0));
  let out = "";
  for (let i=0;i<n;i++) out += `<div class="off-edge ${cls}"></div>`;
  return out;
}

  b("#btnLeaveDock", ()=>{ if (confirm("Ieși din joc?")) leaveGame(); });
  b("#btnMenu", ()=>{ tQuickOpen = false; ui.menuOpen = true; render(); });
  b("#btnCloseModal", ()=>{ ui.chatOpen=false; ui.menuOpen=false; render(); });
  b("#btnChat", ()=>{ ui.chatOpen = true; ui.menuOpen=false; render(); });
  b("#btnRules2", ()=>showRules());
  b("#btnLeave", ()=>{ if (confirm("Ieși din joc?")) leaveGame(); });
  b("#btnSound", ()=>{ ui.sound = !ui.sound; localStorage.setItem(LS.sound, ui.sound?"1":"0"); toast(ui.sound?"Sunet pornit":"Sunet oprit"); render(); });
  b("#btnNextLeg", ()=>act({type:"next_leg"}, null));
  b("#btnNewMatch", ()=>act({type:"new_match"}, null));
  b("#btnHideLeg", ()=>{ ui.hideLeg = S.leg; render(); });
  $$("[data-qd]").forEach(el=>{
    el.onclick = ()=>{
      const txt = el.dataset.qd;
      tQuickOpen = false;
      tBubbles[mySeat()] = {text: txt, until: Date.now() + 4200};
      render();
      sendChat(txt);
    };
  });
  const vsOv = $("#vsOverlay");
  if (vsOv){
    vsOv.onclick = ()=>{ tVsActive = false; vsOv.remove(); };
  }
  const chatForm = $("#chatForm");
  if (chatForm){
    chatForm.onsubmit = (e)=>{ e.preventDefault(); const inp=$("#chatInput"); const t=(inp.value||"").trim();
      if (!t) return; inp.value=""; ui.chatDraft=""; sendChat(t); };
  }
  $$(".quick button").forEach(el=>{ el.onclick = ()=>sendChat(el.dataset.msg || el.textContent); });

  const onPoint = async (pt)=>{
    if (!S.myTurn) return;
    if (tSel === null){
      if (pointHasMyChecker(pt) && canMoveFrom(pt)){ tSel = pt; sfx.draw(); render(); }
      return;
    }
    if (String(tSel) === String(pt)){ tSel = null; render(); return; }
    const isLegal = legalTargetsFrom(tSel).has(String(pt));
    if (isLegal){
      const from = tSel;
      tSel = null;
      sfx.wood();
      optimisticTableMove(from, pt);
      render();
      await act({type:"move", from: from === "bar" ? "bar" : Number(from), to: Number(pt)}, null);
      return;
    }
    if (pointHasMyChecker(pt) && canMoveFrom(pt)){ tSel = pt; sfx.draw(); render(); return; }
    tSel = null; render();
  };
  $$("#app .point").forEach(el=>{
    el.onclick = ()=>onPoint(Number(el.dataset.pt));
  });
  $$("[data-pick-bar]").forEach(el=>{
    el.onclick = ()=>{ tSel = "bar"; sfx.draw(); render(); };
  });
  const offTray = $(".tray." + (mySeat()===0 ? "w" : "b"));
  if (offTray){
    offTray.onclick = async ()=>{
      if (!S.myTurn || tSel === null) return;
      if (!legalTargetsFrom(tSel).has("off")) return;
      const from = tSel; tSel = null;
      sfx.meld();
      optimisticTableMove(from, "off");
      render();
      await act({type:"move", from: from==="bar"?"bar":Number(from), to:"off"}, null);
    };
  }
}

  const div = document.createElement("div");
  div.innerHTML = `<div class="overlay" id="srvOverlay"><div class="modal-wrap"><div class="modal">

      <li><b>Online:</b> adresa serverului găzduit, ex. <b>https://remi.exemplu.ro</b></li>
    </ul>
    <input class="inp" id="srvSetupInput" placeholder="http://192.168.1.10:8080" autocomplete="off">
    <div class="mfoot">
      <button class="btn" id="srvSetupLater">Mai târziu</button>
      <button class="btn primary" id="srvSetupSave">Conectează</button>
    </div>
    <div class="tag" id="srvSetupMsg" style="font-size:12px;margin-top:8px"></div>
  </div></div></div>`;
  document.body.appendChild(div.firstElementChild);
  const inp = document.getElementById("srvSetupInput");
  const msg = document.getElementById("srvSetupMsg");
  inp.value = localStorage.getItem(LS.server) || "";
  document.getElementById("srvSetupLater").onclick = ()=>document.getElementById("srvOverlay").remove();
  document.getElementById("srvSetupSave").onclick = async ()=>{
    let v = (inp.value||"").trim().replace(/\/+$/,"");
    if (!v){ msg.textContent = "Scrie o adresă validă."; return; }
    if (!/^https?:\/\//.test(v)) v = "http://" + v;
    msg.textContent = "Se verifică…";
    try{
      const res = await fetch(v + "/health");
      const d = await res.json();
      if (!d.ok) throw new Error("răspuns invalid");
      localStorage.setItem(LS.server, v);
      document.getElementById("srvOverlay").remove();
      toast("✅ Conectat la server");
      render();
    }catch(e){
      msg.innerHTML = "❌ Nu pot contacta serverul. Verifică adresa și că serverul rulează.<br>Poți oricând schimba adresa din meniul principal.";
    }
  };
}

function boot(){
  // cod din link?
  const params = new URLSearchParams(location.search);
  const code = (params.get("code") || "").toUpperCase();
  if (code) ui.joinCode = code;

  if (session && session.token){
    ui.screen = "loading";
    render();
    refreshNow();
  } else {
    ui.screen = "home";
    render();
    if (code){
      const name = localStorage.getItem(LS.name);
      if (name) joinRoom(code, name);
    }
  }
  if (!DEFAULT_SERVER && ANDROID && !localStorage.getItem(LS.server)){
    setTimeout(showServerSetup, 400);
  }
  // trezeste usor serverul la pornire
  const b0 = apiBase();
  if (b0 || location.protocol.startsWith("http")){
    fetch((b0||"") + "/health").catch(()=>{});
  }
  pollLoop();
  // redesenare la intoarcerea in app
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refreshNow(); });
  // timer local
  setInterval(()=>{
    const el = $("#turnCounter");
    if (el && S && S.phase === "playing"){
      const v = parseInt(el.textContent) - 1;
      if (v >= 0) el.textContent = v;
    }
    // actualizeaza bara de timp a jucatorului de la rand
    if (S && S.phase === "playing"){
      const t = $(".rg-pcard.turn .rg-ptimer i");
      if (t){
        const cur = parseFloat(t.style.width) || 0;
        t.style.width = Math.max(0, cur - (100/Math.max(1,S.turnSeconds))) + "%";
      }
    }
  }, 1000);
  setInterval(()=>{ if (!ui.connected && session) render(); }, 4000);
}

// legare lobby (dupa render)
const _render = render;
render = function(){
  _render();
  if (S && S.phase === "lobby"){
    const b = (id, fn)=>{ const el=$(id); if (el) el.onclick = fn; };
    b("#btnCopy", async ()=>{
      try{ await navigator.clipboard.writeText(S.code); toast("Cod copiat: " + S.code); }
      catch(e){ prompt("Copiază codul camerei:", S.code); }
    });
    b("#btnShare", async ()=>{
      const text = `Joacă Remi Online cu mine! Cod cameră: ${S.code}`;
      if (navigator.share){ try{ await navigator.share({text}); }catch(e){} }
      else { try{ await navigator.clipboard.writeText(text); toast("Invitație copiată"); }catch(e){ prompt("Trimite invitația:", text); } }
    });
    b("#btnReady", ()=>api("/api/ready", {...sessBody(), ready: !(S.players.find(p=>p.id===YOU)||{}).ready}).then(refreshNow));
    b("#btnStart", ()=>{
      pendingStart = true;
      api("/api/ready", {...sessBody(), ready:true, start:true}).then(refreshNow).catch(e=>toast(e.message,"err"));
    });
    b("#btnLeaveLobby", ()=>leaveGame());
    b("#btnLeaveTop", ()=>{ if (confirm("Ieși din cameră?")) leaveGame(); });
    b("#btnRulesTop", ()=>showRules());
    b("#btnAddTester", ()=>{
      const url = (apiBase() ? apiBase() : location.origin + location.pathname) + "?code=" + encodeURIComponent(S.code);
      if (ANDROID && window.AndroidBridge.openUrl) window.AndroidBridge.openUrl(url);
      else window.open(url, "_blank");
    });
    const upd = (sel, key, cast=Number)=>{
      const el = $(sel);
      if (el) el.onchange = ()=>{
        api("/api/action", {...sessBody(), action:{type:"update_opts", opts:{[key]: cast(el.value)}}}).catch(()=>{});
      };
    };
    upd("#optMode", "mode", String);
    upd("#optPlayers", "max_players");
    upd("#optTime", "turn_seconds");
    upd("#optTarget", "target");
  }
  const _ci = $("#chatInput");
  if (_ci) _ci.addEventListener("input", ()=>{ ui.chatDraft = _ci.value; });
  // muta chatul la ultimul mesaj
  const cm = $("#chatMsgs");
  if (cm) cm.scrollTop = cm.scrollHeight;
};

window.addEventListener("load", boot);
window.logout = function(){ clearSession(); session=null; S=null; YOU=null; ui.lastV=-1; render(); };
</script>
</body>
